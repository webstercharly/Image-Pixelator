<!DOCTYPE html>
<html>
<head>
    <title>Generate Test Image</title>
</head>
<body>
    <h1>Test Image Generator</h1>
    <canvas id="canvas" width="64" height="64"></canvas>
    <br>
    <button onclick="downloadTestImage()">Download Test Image</button>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // Create a colorful test pattern with transparency
        // Red square
        ctx.fillStyle = 'rgba(255, 0, 0, 1)';
        ctx.fillRect(0, 0, 32, 32);

        // Green square
        ctx.fillStyle = 'rgba(0, 255, 0, 1)';
        ctx.fillRect(32, 0, 32, 32);

        // Blue square
        ctx.fillStyle = 'rgba(0, 0, 255, 1)';
        ctx.fillRect(0, 32, 32, 32);

        // Yellow square with some transparency
        ctx.fillStyle = 'rgba(255, 255, 0, 0.8)';
        ctx.fillRect(32, 32, 32, 32);

        // Add a circle in the center with gradient
        const gradient = ctx.createRadialGradient(32, 32, 5, 32, 32, 15);
        gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
        gradient.addColorStop(1, 'rgba(128, 128, 128, 1)');
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(32, 32, 15, 0, Math.PI * 2);
        ctx.fill();

        function downloadTestImage() {
            canvas.toBlob(blob => {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'test-image.png';
                a.click();
                URL.revokeObjectURL(url);
            });
        }
    </script>
</body>
</html>
